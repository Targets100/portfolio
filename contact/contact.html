			<div class="contact-container">
				<div class="contact-left-box">
					<div class="contact-left-top-text">
						<p><b>I would love to hear from you!</b></p>
						<p>Fill in the form or contact me in other ways to know more.</p>
					</div>
					<div class="contact-image">
						<img alt="contact me olivia Portrait" src="../images/Contact image.png" />
					</div>

					<div class="contact-left-bottom-info">
						<div><i class="bi bi-linkedin" style="margin-right: 5px;"></i><span>Olivia trulsson</span></div>
						<div><i class="bi bi-envelope-fill" style="margin-right: 5px;"></i><span><a
									href="oliviatrulsson@gmail.com">oliviatrulsson@gmail.com</a></span></div>
						<div><i class="bi bi-telephone-fill" style="margin-right: 5px;"></i><span>+46 733 23 36
								60</span></div>
					</div>
				</div>
				<div class="contact-right-box">
					<div class="container">
						<form>
							<div class="mb-4">
								<label class="form-label">Name</label>
								<input type="text" class="form-control underline-input" placeholder="Your name" />
							</div>

							<div class="mb-4">
								<label class="form-label">Email</label>
								<input type="email" class="form-control underline-input" placeholder="Your email" />
							</div>

							<div class="mb-4">
								<label class="form-label">Message</label>
								<textarea class="form-control underline-input" rows="4"
									placeholder="Your message"></textarea>
							</div>

							<!-- Button row -->
							<div class="d-flex justify-content-end">
								<button type="submit"
									class="btn btn-primary d-flex align-items-center gap-2 submit-button">
									Send <i class="bi bi-send-fill"></i>
								</button>
							</div>
						</form>
					</div>
				</div>
			</div>
