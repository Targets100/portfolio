<section class="contact-section">
    
    <div class="contact-left">
        <div class="contact-header">
            <h2>I would love to hear from you!</h2>
            <p>Fill in the form or contact me in other ways to know more.</p>
        </div>

            <img src="Profil.png" alt="Profile Photo" class="profile-img">
        </div>

        <div class="contact-details">
            <div class="contact-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#9370DB"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                <span>Olivia Trulsson</span>
            </div>
            <div class="contact-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#9370DB"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <span>oliviatrulsson@gmail.com</span>
            </div>
            <div class="contact-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#9370DB"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                <span>+46 733 23 36 60</span>
            </div>
        </div>
    </div>

    <div class="contact-right">
        <form class="contact-card">
            <div class="form-group">
                <label for="fullname">Full name <span class="required">*</span></label>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Write your message here <span class="required">*</span></label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <div class="form-footer">
                <button type="submit" class="btn-send">
                    Send 
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </form>
    </div>
</section>
